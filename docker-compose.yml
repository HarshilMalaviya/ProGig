version: "3.8"
services:
    mysql:
        image: mysql:8
        container_name: mysql
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root1234
            MYSQL_DATABASE: db

        volumes:
          - ./mysql_data:/var/lib/mysql

    springboot:
        build: .
        container_name: springboot
        environment:
            - mysql_url=jdbc:mysql://192.168.1.15:3306/progig
            - mysql_user=dhyey
            - mysql_password=Dhyey2@
        ports:
            -   "3030:8080"
        depends_on:
            -   mysql